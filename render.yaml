# Render Blueprint: one Web Service (API + built React UI) and a free Postgres database
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: group-trip
    runtime: node
    plan: free
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: group-trip-db
          property: connectionString

databases:
  - name: group-trip-db
    plan: free
    databaseName: group_trip
    user: group_trip
